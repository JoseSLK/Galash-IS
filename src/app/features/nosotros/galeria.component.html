<section id="galeria" class="u-section" appReveal aria-labelledby="gallery-title"><div class="gallery-intro"><h2 id="gallery-title">{{ titulo || 'Galería GALASH' }}</h2></div>@if(fotos.length) {<div class="gallery-window" role="region" aria-label="Galería de la comunidad GALASH" tabindex="0" [class.paused]="paused()"><div class="gallery-strip">@for(copy of [0,1];track copy) {<div class="gallery-group" [attr.aria-hidden]="copy === 1 ? 'true' : null">@for(foto of tarjetas;track $index) {<figure [attr.aria-hidden]="$index >= fotos.length ? 'true' : null"><div class="photo-frame"><img [src]="foto.imagenUrl" [alt]="copy === 0 ? foto.imagenAlt : ''" loading="lazy" decoding="async"></div><figcaption><span class="photo-dot" aria-hidden="true"></span>{{ foto.titulo }}</figcaption></figure>}</div>}</div></div><div class="gallery-controls"><button type="button" (click)="toggle()" [attr.aria-pressed]="paused()">{{paused()?'Reanudar':'Pausar'}} galería</button></div>} @else {<p class="empty">Contenido en preparación</p>}</section>
