<section id="colaborar" class="u-section" appReveal aria-labelledby="collab-title"><div class="collaborate-panel"><div><h2 id="collab-title">Quiero <span>colaborar</span></h2><p>Conectemos preguntas, talento y nuevas posibilidades.</p></div><form #form="ngForm" (ngSubmit)="send(form.valid)" novalidate><label for="collaborar-email">Tu correo electrónico</label><div class="email-row"><input id="collaborar-email" name="email" type="email" email required [(ngModel)]="email" #emailControl="ngModel" autocomplete="email" placeholder="nombre@ejemplo.com" aria-describedby="collab-help collab-result" [attr.aria-invalid]="(submitted || emailControl.touched) && emailControl.invalid ? 'true' : null"><button class="u-button primary" type="submit">Enviar <span aria-hidden="true">↗</span></button></div><p id="collab-help">Solo validación visual. No se enviará ni almacenará tu correo.</p><p id="collab-result" role="status" [class.error]="submitted && form.invalid">{{ feedback() }}</p></form></div></section>
