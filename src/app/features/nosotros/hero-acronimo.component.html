<div class="acronym-copy"><p class="eyebrow">NOSOTROS · UPTC SECCIONAL SOGAMOSO</p><h1 id="nosotros-title">Grupo de investigación en</h1><div class="letter-card" [attr.aria-live]="manual() || !running() ? 'polite' : 'off'" aria-atomic="true" (mouseenter)="hover(true)" (mouseleave)="hover(false)" (focusin)="focusIn()" (focusout)="focusOut($event)">@for(item of [actual()];track item.id) {<div class="card-content"><p class="eyebrow">{{item.etiqueta}}</p><h2>{{item.palabra}}</h2><p class="letter-description">{{item.frase}}</p></div>}</div><div class="playback"><button type="button" (click)="toggle()" [attr.aria-pressed]="paused()">{{paused()?'Reproducir':'Pausar'}}</button><span>o toca una letra alrededor del logo</span></div></div>
<div class="hero-emblem"><div class="logo-stage">@if(logoUrl) {<img [src]="logoUrl" alt="Logo de GALASH sin fondo" fetchpriority="high">}<div class="letter-buttons" role="group" aria-label="Explorar las letras de GALASH" (mouseenter)="hover(true)" (mouseleave)="hover(false)" (focusin)="focusIn()" (focusout)="focusOut($event)">@for(item of letras;track item.id;let i=$index) {<button type="button" class="letter-button" [class.selected]="selected()===i" [attr.aria-label]="item.palabra" [attr.aria-pressed]="selected()===i" (click)="choose(i)">{{item.letra}}</button>}</div></div></div>
